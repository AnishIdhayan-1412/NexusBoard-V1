services:
  - type: web
    name: nexusboard
    env: docker
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health/
    envVars:
      - key: DEBUG
        value: False
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: .onrender.com
      - key: DATABASE_URL
        fromDatabase:
          name: nexusboard-db
          property: connectionString

databases:
  - name: nexusboard-db
    databaseName: nexusboard
    user: nexus
