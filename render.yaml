services:
  - type: web
    name: nexusboard
    runtime: docker
    plan: free
    healthCheckPath: /health/
    envVars:
      - key: DEBUG
        value: false
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: nexusboard.onrender.com,nexusboard.up.railway.app
      - key: DATABASE_URL
        fromDatabase:
          name: nexusboard-db
          property: connectionString
      - key: SECURE_SSL_REDIRECT
        value: false  # Render handles TLS termination

databases:
  - name: nexusboard-db
    plan: free
