# ============================================================
# NexusBoard CI/CD Pipeline
# Runs on every push and pull request to main
# Tests → Build Docker → Deploy (if on main)
# ============================================================

name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  # ─────────────────────────────────────────
  # Job 1: Run Tests
  # ─────────────────────────────────────────
  test:
    name: 🧪 Run Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Create .env for testing
        run: |
          echo "DEBUG=True" > .env
          echo "SECRET_KEY=ci-test-secret-key-not-for-production-use" >> .env
          echo "ALLOWED_HOSTS=localhost,127.0.0.1" >> .env
          echo "DATABASE_URL=sqlite:///test_db.sqlite3" >> .env

      - name: Run migrations
        run: python manage.py migrate --noinput

      - name: Run tests
        run: python manage.py test --verbosity=2

      - name: Run Django system check
        run: python manage.py check

  # ─────────────────────────────────────────
  # Job 2: Build Docker Image
  # ─────────────────────────────────────────
  docker:
    name: 🐳 Build Docker Image
    runs-on: ubuntu-latest
    needs: test  # Only runs if tests pass

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Create .env for Docker build
        run: |
          echo "DEBUG=False" > .env
          echo "SECRET_KEY=docker-build-test-key-not-real" >> .env
          echo "ALLOWED_HOSTS=localhost" >> .env
          echo "DATABASE_URL=sqlite:///db.sqlite3" >> .env

      - name: Build Docker image
        run: docker build -t nexusboard:${{ github.sha }} .

      - name: Test Docker image runs
        run: |
          docker run -d --name test-container \
            -e SECRET_KEY=test-key-for-docker \
            -e DEBUG=False \
            -e ALLOWED_HOSTS=localhost \
            -e DATABASE_URL=sqlite:///db.sqlite3 \
            -p 8000:8000 \
            nexusboard:${{ github.sha }}
          sleep 5
          docker logs test-container
          docker stop test-container

  # ─────────────────────────────────────────
  # Job 3: Deploy to Railway (main branch only)
