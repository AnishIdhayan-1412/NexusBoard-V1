{% extends 'base.html' %}
{% block title %}Delete Post{% endblock %}

{% block content %}
<div class="row justify-content-center" style="margin-top:3rem">
  <div class="col-11 col-sm-8 col-md-5">
    <div class="card text-center" style="border-top:3px solid var(--nb-danger)">
      <div class="card-body p-4 p-sm-5">

        <!-- Icon -->
        <div style="width:64px;height:64px;border-radius:50%;background:rgba(193,84,63,0.12);
                    display:flex;align-items:center;justify-content:center;margin:0 auto 1.25rem">
          <i class="bi bi-trash3-fill" style="font-size:1.6rem;color:var(--nb-danger)"></i>
        </div>

        <h5 class="mb-1" style="font-weight:700">Delete this post?</h5>
        <p class="text-muted mb-3" style="font-size:.875rem">This action is permanent and cannot be undone.</p>

        <!-- Post title preview -->
        <div class="p-3 rounded mb-4"
             style="background:var(--nb-surface-2);border:1px solid var(--nb-border);text-align:left">
          <p class="mb-0" style="font-size:.88rem;color:var(--nb-text);font-weight:600;line-height:1.4">
            {{ post.title }}
          </p>
          <span class="text-muted" style="font-size:.75rem">
            {{ post.community.name }} · {{ post.created_at|timesince }} ago
          </span>
        </div>

        <!-- Actions -->
        <div class="d-flex gap-2 justify-content-center">
          <form method="post">
            {% csrf_token %}
            <button type="submit" class="btn btn-danger px-4 py-2" style="font-weight:600">
              <i class="bi bi-trash3 me-1"></i>Yes, Delete
            </button>
          </form>
          <a href="{% url 'posts:detail' post.pk %}"
             class="btn btn-outline-secondary px-4 py-2" style="font-weight:600">
            Cancel
          </a>
        </div>

      </div>
    </div>
  </div>
</div>
{% endblock %}
