{% extends 'base.html' %}
{% block title %}Login{% endblock %}
{% block content %}
<div class="row justify-content-center mt-4">
  <div class="col-md-5 col-sm-10">
    <div class="card p-4">
      <div class="text-center mb-4">
        <div class="navbar-brand" style="font-size:2rem;display:block">⬡ NexusBoard</div>
        <h5 class="mt-2 mb-0">Welcome back</h5>
        <p class="text-muted" style="font-size:.9rem">Sign in to your account</p>
      </div>
      <form method="post">
        {% csrf_token %}
        <div class="mb-3">
          <label class="form-label text-muted" style="font-size:.85rem;font-weight:600">USERNAME</label>
          {{ form.username }}
        </div>
        <div class="mb-4">
          <label class="form-label text-muted" style="font-size:.85rem;font-weight:600">PASSWORD</label>
          {{ form.password }}
        </div>
        <button type="submit" class="btn btn-primary w-100 py-2" style="border-radius:8px">Sign In</button>
      </form>
      <hr>
      <p class="text-center text-muted mb-0" style="font-size:.9rem">
        New to NexusBoard? <a href="{% url 'accounts:register' %}" style="color:var(--nb-primary)">Create an account</a>
      </p>
    </div>
  </div>
</div>
{% endblock %}
