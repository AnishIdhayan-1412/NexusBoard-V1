{% extends 'base.html' %}
{% block title %}Create Community{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-7">
    <div class="card p-4">
      <h5 class="mb-4"><i class="bi bi-plus-circle me-2"></i>Create a Community</h5>
      <form method="post" enctype="multipart/form-data">
        {% csrf_token %}
        {% for field in form %}
        <div class="mb-3">
          <label class="form-label text-muted" style="font-size:.85rem;font-weight:600">{{ field.label|upper }}</label>
          {{ field }}
          {% if field.errors %}<div class="text-danger" style="font-size:.82rem">{{ field.errors.0 }}</div>{% endif %}
        </div>
        {% endfor %}
        <div class="d-flex gap-2 mt-4">
          <button type="submit" class="btn btn-primary px-4">Create Community</button>
          <a href="{% url 'communities:list' %}" class="btn btn-outline-secondary">Cancel</a>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}
