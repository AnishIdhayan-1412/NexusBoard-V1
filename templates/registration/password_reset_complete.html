{% extends 'base.html' %}
{% block title %}Password Reset Complete{% endblock %}
{% block content %}
<div class="row justify-content-center"><div class="col-md-5 col-11">
  <div class="card px-4 py-5 text-center">
    <div style="font-size:3rem">✅</div>
    <h5 class="mt-3" style="font-weight:700">Password updated!</h5>
    <p class="text-muted" style="font-size:.88rem">Your password has been set. You can now log in.</p>
    <a href="{% url 'accounts:login' %}" class="btn btn-primary mt-2">Log In</a>
  </div>
</div></div>
{% endblock %}
