{% extends 'base.html' %}
{% block title %}Reset Password{% endblock %}
{% block content %}
<div class="row justify-content-center"><div class="col-md-5 col-11">
  <div class="card px-4 py-4">
    <h5 class="mb-3" style="font-weight:700">Reset your password</h5>
    <p class="text-muted" style="font-size:.88rem">Enter your email and we'll send you a reset link.</p>
    <form method="post">{% csrf_token %}
      {% for field in form %}
      <div class="mb-3">
        <label class="form-label" style="font-size:.8rem;text-transform:uppercase;letter-spacing:.05em;color:var(--nb-text-muted)">{{ field.label }}</label>
        {{ field }}
        {% if field.errors %}<div class="text-danger" style="font-size:.8rem">{{ field.errors.0 }}</div>{% endif %}
      </div>
      {% endfor %}
      <button type="submit" class="btn btn-primary w-100">Send Reset Link</button>
    </form>
  </div>
</div></div>
{% endblock %}
