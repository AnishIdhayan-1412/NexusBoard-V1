{% extends 'base.html' %}
{% block title %}Email Sent{% endblock %}
{% block content %}
<div class="row justify-content-center"><div class="col-md-5 col-11">
  <div class="card px-4 py-5 text-center">
    <div style="font-size:3rem">📧</div>
    <h5 class="mt-3" style="font-weight:700">Check your email</h5>
    <p class="text-muted" style="font-size:.88rem">If an account exists with that email, you'll receive a reset link shortly.</p>
    <a href="{% url 'accounts:login' %}" class="btn btn-outline-primary mt-2">Back to Login</a>
  </div>
</div></div>
{% endblock %}
